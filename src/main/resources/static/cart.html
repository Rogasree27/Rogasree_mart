<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart | ROGASREE MART</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Cart</h1>

    <div id="cartItems">
        <p>Loading cart...</p>
    </div>

    <hr>

    <h2>Cart Summary</h2>

    <p>
        Total Items:
        <span id="totalItems">0</span>
    </p>

    <p>
        Subtotal:
        ₹<span id="subtotal">0</span>
    </p>

    <p>
        Delivery:
        ₹<span id="delivery">0</span>
    </p>

    <h3>
        Grand Total:
        ₹<span id="grandTotal">0</span>
    </h3>

    <button type="button" onclick="placeOrder()">
        Proceed to Checkout
    </button>


    <script>
        // Dynamic API Base URL for Railway compatibility
        const API_BASE_URL = window.location.hostname === "localhost" 
            ? "http://localhost:8080" 
            : "https://rogasreemart-production.up.railway.app";

        const userId = localStorage.getItem("loggedInUserId");

        const cartItems = document.getElementById("cartItems");
        const totalItems = document.getElementById("totalItems");
        const subtotal = document.getElementById("subtotal");
        const delivery = document.getElementById("delivery");
        const grandTotal = document.getElementById("grandTotal");


        async function displayCart() {

            if (!userId) {
                cartItems.innerHTML = "<p>Please login first.</p>";
                return;
            }

            try {
                const cartResponse = await fetch(API_BASE_URL + "/cart/" + userId);

                if (!cartResponse.ok) {
                    throw new Error("Unable to load cart");
                }

                const cart = await cartResponse.json();

                const productResponse = await fetch(API_BASE_URL + "/products");

                if (!productResponse.ok) {
                    throw new Error("Unable to load products");
                }

                const products = await productResponse.json();

                cartItems.innerHTML = "";

                if (cart.length === 0) {
                    cartItems.innerHTML = "<p>Your cart is empty.</p>";

                    totalItems.textContent = "0";
                    subtotal.textContent = "0";
                    delivery.textContent = "0";
                    grandTotal.textContent = "0";

                    return;
                }

                let totalQuantity = 0;
                let totalPrice = 0;

                cart.forEach(function(item) {

                    const product = products.find(function(product) {
                        return product.id === item.productId;
                    });

                    if (!product) {
                        return;
                    }

                    const itemTotal = product.price * item.quantity;

                    totalQuantity += item.quantity;
                    totalPrice += itemTotal;

                    const itemDiv = document.createElement("div");

                    itemDiv.innerHTML =
                        "<h3>" + product.name + "</h3>" +
                        "<p>Price: ₹" + product.price + "</p>" +
                        "<p>Quantity: " + item.quantity + "</p>" +
                        "<p>Item Total: ₹" + itemTotal + "</p>" +
                        "<button type='button' onclick='removeFromCart(" + item.id + ")'>" +
                        "Remove" +
                        "</button>" +
                        "<hr>";

                    cartItems.appendChild(itemDiv);

                });

                totalItems.textContent = totalQuantity;
                subtotal.textContent = totalPrice;
                delivery.textContent = 0;
                grandTotal.textContent = totalPrice;

            } catch (error) {
                console.error(error);
                cartItems.innerHTML = "<p>Unable to load cart from server.</p>";
            }
        }


        async function removeFromCart(cartId) {
            try {
                const response = await fetch(API_BASE_URL + "/cart/" + cartId, {
                    method: "DELETE"
                });

                if (!response.ok) {
                    throw new Error("Unable to remove item");
                }

                alert("Item removed from cart!");
                displayCart();

            } catch (error) {
                console.error(error);
                alert("Unable to remove item.");
            }
        }


        function placeOrder() {
            window.location.href = "checkout.html";
        }


        displayCart();
    </script>

</body>

</html>
