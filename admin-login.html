<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | ROGASREE MART</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>ROGASREE MART</h1>

            <h2>Admin Login</h2>

            <p>Login to Admin Dashboard</p>

            <!-- ADMIN LOGIN -->

            <form id="adminLoginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter admin email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter admin password"
                        required>

                </div>


                <!-- FORGOT PASSWORD -->

                <p style="text-align: right; margin-top: -5px;">

                    <a
                        href="#"
                        onclick="showForgotPassword(); return false;">

                        Forgot Password?

                    </a>

                </p>


                <button
                    type="submit"
                    id="adminLoginButton">

                    Admin Login

                </button>

            </form>


            <p id="adminMessage"></p>


            <!-- FORGOT PASSWORD SECTION -->

            <div
                id="forgotPasswordSection"
                style="display: none; margin-top: 20px;">

                <hr>

                <h3>Reset Admin Password</h3>

                <p>
                    Enter your admin email and new password.
                </p>


                <div class="form-group">

                    <label for="forgotEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="Enter admin email">

                </div>


                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password">

                </div>


                <button
                    type="button"
                    id="resetPasswordButton"
                    onclick="resetAdminPassword()">

                    Reset Password

                </button>


                <p id="forgotMessage"></p>


                <p>

                    <a
                        href="#"
                        onclick="hideForgotPassword(); return false;">

                        Back to Admin Login

                    </a>

                </p>

            </div>

        </div>

    </div>


    <script>

        /* =========================
           ADMIN LOGIN
        ========================= */

        document
            .getElementById("adminLoginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const button =
                    document.getElementById(
                        "adminLoginButton"
                    );


                const message =
                    document.getElementById(
                        "adminMessage"
                    );


                button.disabled = true;

                button.textContent =
                    "Logging in...";


                try {

                    const response =
                        await fetch(
                            "http://localhost:8080/admin/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    if (!response.ok) {

                        throw new Error(
                            "Admin login failed"
                        );

                    }


                    const admin =
                        await response.json();


                    if (!admin || !admin.id) {

                        message.textContent =
                            "Invalid admin email or password.";

                        message.style.color =
                            "red";

                        return;

                    }


                    localStorage.setItem(
                        "adminId",
                        admin.id
                    );


                    localStorage.setItem(
                        "adminName",
                        admin.name
                    );


                    localStorage.setItem(
                        "adminEmail",
                        admin.email
                    );


                    message.textContent =
                        "Admin login successful!";

                    message.style.color =
                        "green";


                    setTimeout(function() {

                        window.location.href =
                            "admin-dashboard.html";

                    }, 500);


                } catch (error) {

                    console.error(error);


                    message.textContent =
                        "Backend connection failed. Please start Spring Boot.";

                    message.style.color =
                        "red";


                } finally {

                    button.disabled = false;

                    button.textContent =
                        "Admin Login";

                }

            });


        /* =========================
           SHOW FORGOT PASSWORD
        ========================= */

        function showForgotPassword() {

            document
                .getElementById("forgotPasswordSection")
                .style.display = "block";

        }


        /* =========================
           HIDE FORGOT PASSWORD
        ========================= */

        function hideForgotPassword() {

            document
                .getElementById("forgotPasswordSection")
                .style.display = "none";

        }


        /* =========================
           RESET ADMIN PASSWORD
        ========================= */

        async function resetAdminPassword() {

            const email =
                document
                    .getElementById("forgotEmail")
                    .value
                    .trim();


            const newPassword =
                document
                    .getElementById("newPassword")
                    .value;


            const resetButton =
                document.getElementById(
                    "resetPasswordButton"
                );


            const forgotMessage =
                document.getElementById(
                    "forgotMessage"
                );


            if (!email || !newPassword) {

                forgotMessage.textContent =
                    "Please enter email and new password.";

                forgotMessage.style.color =
                    "red";

                return;

            }


            resetButton.disabled = true;

            resetButton.textContent =
                "Updating...";


            try {

                const response =
                    await fetch(
                        "http://localhost:8080/admin/forgot-password",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                email: email,

                                newPassword: newPassword

                            })
                        }
                    );


                const result =
                    await response.text();


                if (result ===
                    "Password updated successfully") {

                    forgotMessage.textContent =
                        "Password updated successfully!";

                    forgotMessage.style.color =
                        "green";


                    document
                        .getElementById("forgotEmail")
                        .value = "";


                    document
                        .getElementById("newPassword")
                        .value = "";


                } else {

                    forgotMessage.textContent =
                        result;

                    forgotMessage.style.color =
                        "red";

                }


            } catch (error) {

                console.error(error);


                forgotMessage.textContent =
                    "Backend connection failed. Please start Spring Boot.";

                forgotMessage.style.color =
                    "red";

            } finally {

                resetButton.disabled = false;

                resetButton.textContent =
                    "Reset Password";

            }

        }

    </script>

</body>

</html>
