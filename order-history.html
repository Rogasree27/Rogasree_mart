<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders | ROGASREE MART</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Orders</h1>

    <div id="orders">
        <p>Loading orders...</p>
    </div>


    <script>

        const userId =
            localStorage.getItem("loggedInUserId");

        const ordersDiv =
            document.getElementById("orders");


        async function loadOrders() {

            if (!userId) {

                ordersDiv.innerHTML =
                    "<p>Please login first.</p>";

                return;
            }


            try {

                const response =
                    await fetch(
                        "http://localhost:8080/orders/" +
                        userId
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to load orders"
                    );
                }


                const orders =
                    await response.json();


                ordersDiv.innerHTML = "";


                if (orders.length === 0) {

                    ordersDiv.innerHTML =
                        "<p>No orders found.</p>";

                    return;
                }


                orders.forEach(function(order) {

                    const orderDiv =
                        document.createElement("div");


                    orderDiv.innerHTML =

                        "<h2>Order #" +
                        order.id +
                        "</h2>" +

                        "<p>Total Amount: ₹" +
                        order.totalAmount +
                        "</p>" +

                        "<p>Status: " +
                        order.status +
                        "</p>" +

                        "<hr>";


                    ordersDiv.appendChild(
                        orderDiv
                    );

                });


            } catch (error) {

                console.error(error);

                ordersDiv.innerHTML =
                    "<p>Unable to load orders from server.</p>";
            }
        }


        loadOrders();

    </script>

</body>

</html>
