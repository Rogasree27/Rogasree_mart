spring.application.name=rogasree_mart

# Railway DB_URL environment variable-ah use pannum. Local-la run panna localhost-ukku fallback aagum.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rogasree_mart}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Rogasree@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Port (Railway dynamic-a assign panra PORT-a eduthukum)
server.port=${PORT:8080}