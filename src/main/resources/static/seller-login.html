<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Login, Registration & Forgot Password | ROGASREE MART</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f5f1e8;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }

        .login-card h2 {
            margin-bottom: 25px;
            color: #0b3d20;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #0b3d20;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-btn:hover {
            background-color: #145a32;
        }

        .links-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .switch-text {
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 14px;
        }

        .switch-text a, .links-row a {
            color: #0b3d20;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .switch-text a:hover, .links-row a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0b3d20;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-card">
        
        <!-- SELLER LOGIN FORM -->
        <div id="loginSection">
            <h2>Seller Login</h2>

            <form id="sellerLoginForm" onsubmit="handleSellerLogin(event)">
                <div class="form-group">
                    <label for="sellerEmail">Seller email</label>
                    <input type="email" id="sellerEmail" required placeholder="seller@rogasree.com">
                </div>

                <div class="form-group">
                    <label for="sellerPassword">Password</label>
                    <input type="password" id="sellerPassword" required placeholder="********">
                </div>

                <button type="submit" class="login-btn">Enter Seller Centre</button>

                <div class="links-row">
                    <a onclick="toggleForm('forgot')">Forgot password?</a>
                </div>
            </form>

            <div class="switch-text">
                New seller? <a onclick="toggleForm('register')">Register here</a>
            </div>
        </div>

        <!-- SELLER REGISTRATION FORM -->
        <div id="registerSection" class="hidden">
            <h2>New Seller Registration</h2>

            <form id="sellerRegisterForm" onsubmit="handleSellerRegister(event)">
                <div class="form-group">
                    <label for="regName">Seller Name</label>
                    <input type="text" id="regName" required placeholder="Enter your name or store name">
                </div>

                <div class="form-group">
                    <label for="regEmail">Seller email</label>
                    <input type="email" id="regEmail" required placeholder="seller@rogasree.com">
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" required placeholder="********">
                </div>

                <button type="submit" class="login-btn">Register & Login</button>
            </form>

            <div class="switch-text">
                Already have an account? <a onclick="toggleForm('login')">Login here</a>
            </div>
        </div>

        <!-- FORGOT PASSWORD FORM -->
        <div id="forgotSection" class="hidden">
            <h2>Reset Password</h2>

            <form id="sellerForgotForm" onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label for="forgotEmail">Registered Email</label>
                    <input type="email" id="forgotEmail" required placeholder="seller@rogasree.com">
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required placeholder="Enter new password">
                </div>

                <button type="submit" class="login-btn">Update Password</button>
            </form>

            <div class="switch-text">
                Remember your password? <a onclick="toggleForm('login')">Login here</a>
            </div>
        </div>

        <a href="home.html" class="back-link">Return to main page</a>
    </div>

    <script>
        function toggleForm(formType) {
            const loginSec = document.getElementById("loginSection");
            const regSec = document.getElementById("registerSection");
            const forgotSec = document.getElementById("forgotSection");

            loginSec.classList.add("hidden");
            regSec.classList.add("hidden");
            forgotSec.classList.add("hidden");

            if (formType === 'register') {
                regSec.classList.remove("hidden");
            } else if (formType === 'forgot') {
                forgotSec.classList.remove("hidden");
            } else {
                loginSec.classList.remove("hidden");
            }
        }

        // 1. Seller Login URL
        async function handleSellerLogin(event) {
            event.preventDefault();
            const email = document.getElementById("sellerEmail").value.trim();
            const password = document.getElementById("sellerPassword").value.trim();

            try {
                const response = await fetch("/seller/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email, password: password })
                });

                if (!response.ok) throw new Error("Invalid credentials");
                const data = await response.json();
                
                localStorage.setItem("loggedInSellerId", data.id);
                localStorage.setItem("loggedInSellerEmail", email);
                alert("Login successful!");
                window.location.href = "seller-dashboard.html";
            } catch (error) {
                console.error(error);
                alert("Login failed. Please check your email/password or backend deployment.");
            }
        }

        // 2. Seller Registration URL (Matches RegisterController or seller endpoint)
        async function handleSellerRegister(event) {
            event.preventDefault();
            const name = document.getElementById("regName").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const password = document.getElementById("regPassword").value.trim();

            try {
                // If your RegisterController uses a different path like "/register", change it here. 
                // Using "/seller/register" or standard path based on backend structure:
                const response = await fetch("/seller/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: name, email: email, password: password })
                });

                if (!response.ok) throw new Error("Registration failed");
                const data = await response.json();

                localStorage.setItem("loggedInSellerId", data.id);
                localStorage.setItem("loggedInSellerEmail", email);
                alert("Registration successful!");
                window.location.href = "seller-dashboard.html";
            } catch (error) {
                console.error(error);
                alert("Registration failed. Email might already exist or backend endpoint needs checking.");
            }
        }

        // 3. Forgot Password URL
        async function handleForgotPassword(event) {
            event.preventDefault();
            const email = document.getElementById("forgotEmail").value.trim();
            const newPassword = document.getElementById("newPassword").value.trim();

            try {
                const response = await fetch("/seller/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email, password: newPassword })
                });

                if (!response.ok) throw new Error("Reset failed");
                alert("Password updated successfully! Please login.");
                toggleForm('login');
            } catch (error) {
                console.error(error);
                alert("Password reset failed. Please check backend configuration.");
            }
        }
    </script>
</body>
</html>
