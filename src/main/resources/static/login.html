<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | ROGASREE MART</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>

    <div class="login-container">

        <div class="login-box">

            <h1>ROGASREE MART</h1>

            <p>Login to your account</p>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <!-- FORGOT PASSWORD -->

                <p style="text-align: right; margin-top: -5px;">

                    <a
                        href="#"
                        onclick="showForgotPassword(); return false;">

                        Forgot Password?

                    </a>

                </p>


                <button
                    type="submit"
                    id="loginButton">

                    Login

                </button>

            </form>


            <!-- LOGIN MESSAGE -->

            <p
                id="loginMessage"
                style="
                    display: none;
                    margin-top: 15px;
                    font-weight: bold;
                ">
            </p>


            <p>

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>


            <!-- FORGOT PASSWORD SECTION -->

            <div
                id="forgotPasswordSection"
                style="display: none; margin-top: 20px;">

                <hr>

                <h3>Reset Password</h3>

                <p>
                    Enter your registered email and new password.
                </p>


                <div class="form-group">

                    <label for="forgotEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="Enter your registered email">

                </div>


                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password">

                </div>


                <button
                    type="button"
                    id="resetPasswordButton"
                    onclick="resetPassword()">

                    Reset Password

                </button>


                <p
                    id="forgotMessage"
                    style="font-weight: bold;">
                </p>


                <p>

                    <a
                        href="#"
                        onclick="hideForgotPassword(); return false;">

                        Back to Login

                    </a>

                </p>

            </div>

        </div>

    </div>


    <script>

        // API Base URL (Railway-kku blank "" potta, atuve current live domain-oda connect aagum)
        const API_BASE_URL = "";


        /* =========================
           LOGIN
        ========================= */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const loginButton =
                        document.getElementById(
                            "loginButton"
                        );


                    const loginMessage =
                        document.getElementById(
                            "loginMessage"
                        );


                    loginMessage.textContent = "";

                    loginMessage.style.display =
                        "none";


                    loginButton.disabled = true;

                    loginButton.textContent =
                        "Logging in...";


                    try {

                        const response =
                            await fetch(
                                API_BASE_URL + "/login",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body: JSON.stringify({

                                        email: email,

                                        password: password

                                    })
                                }
                            );


                        /*
                         * IMPORTANT:
                         *
                         * Backend response received.
                         * So don't immediately treat
                         * response.ok as connection failure.
                         */


                        let user = null;


                        try {

                            user =
                                await response.json();

                        } catch (jsonError) {

                            user = null;

                        }


                        /*
                         * WRONG EMAIL / PASSWORD
                         */

                        if (
                            !user ||
                            !user.id
                        ) {

                            loginMessage.textContent =
                                "Invalid email or password.";

                            loginMessage.style.color =
                                "red";

                            loginMessage.style.display =
                                "block";

                            return;
                        }


                        /*
                         * CORRECT LOGIN
                         */

                        localStorage.setItem(
                            "loggedInUserId",
                            user.id
                        );


                        localStorage.setItem(
                            "loggedInUserName",
                            user.name
                        );


                        localStorage.setItem(
                            "loggedInUserEmail",
                            user.email
                        );


                        loginMessage.textContent =
                            "Login successful!";

                        loginMessage.style.color =
                            "green";

                        loginMessage.style.display =
                            "block";


                        setTimeout(function() {

                            window.location.href =
                                "home.html";

                        }, 500);


                    } catch (error) {

                        /*
                         * This happens only when
                         * Spring Boot cannot be reached.
                         */

                        console.error(
                            "Backend connection error:",
                            error
                        );


                        loginMessage.textContent =
                            "Backend connection failed. Please start Spring Boot.";

                        loginMessage.style.color =
                            "red";

                        loginMessage.style.display =
                            "block";

                    } finally {

                        loginButton.disabled =
                            false;

                        loginButton.textContent =
                            "Login";

                    }

                }
            );


        /* =========================
           SHOW FORGOT PASSWORD
        ========================= */

        function showForgotPassword() {

            document
                .getElementById(
                    "forgotPasswordSection"
                )
                .style.display = "block";

        }


        /* =========================
           HIDE FORGOT PASSWORD
        ========================= */

        function hideForgotPassword() {

            document
                .getElementById(
                    "forgotPasswordSection"
                )
                .style.display = "none";

        }


        /* =========================
           RESET PASSWORD
        ========================= */

        async function resetPassword() {

            const email =
                document
                    .getElementById(
                        "forgotEmail"
                    )
                    .value
                    .trim();


            const newPassword =
                document
                    .getElementById(
                        "newPassword"
                    )
                    .value;


            const resetButton =
                document.getElementById(
                    "resetPasswordButton"
                );


            const forgotMessage =
                document.getElementById(
                    "forgotMessage"
                );


            if (
                !email ||
                !newPassword
            ) {

                forgotMessage.textContent =
                    "Please enter email and new password.";

                forgotMessage.style.color =
                    "red";

                return;

            }


            resetButton.disabled = true;

            resetButton.textContent =
                "Updating...";


            try {

                const response =
                    await fetch(
                        API_BASE_URL + "/forgot-password",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                email: email,

                                newPassword:
                                    newPassword

                            })
                        }
                    );


                const result =
                    await response.text();


                if (
                    result ===
                    "Password updated successfully"
                ) {

                    forgotMessage.textContent =
                        "Password updated successfully!";

                    forgotMessage.style.color =
                        "green";


                    document
                        .getElementById(
                            "forgotEmail"
                        )
                        .value = "";


                    document
                        .getElementById(
                            "newPassword"
                        )
                        .value = "";

                } else {

                    forgotMessage.textContent =
                        result;

                    forgotMessage.style.color =
                        "red";

                }


            } catch (error) {

                console.error(error);


                forgotMessage.textContent =
                    "Backend connection failed. Please start Spring Boot.";

                forgotMessage.style.color =
                    "red";

            } finally {

                resetButton.disabled =
                    false;

                resetButton.textContent =
                    "Reset Password";

            }

        }

    </script>

</body>

</html>
