<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | ROGASREE MART</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Extra safety inline styles in case style.css lacks them */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #333;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-box">
            <h1>ROGASREE MART</h1>
            <h2>Admin Login</h2>
            <p>Login to Admin Dashboard</p>

            <!-- ADMIN LOGIN FORM -->
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter admin email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter admin password" required>
                </div>

                <!-- FORGOT PASSWORD LINK -->
                <p style="text-align: right; margin-top: -5px;">
                    <a href="#" onclick="showForgotPassword(); return false;">Forgot Password?</a>
                </p>

                <button type="submit" id="adminLoginButton">Admin Login</button>
            </form>

            <p id="adminMessage" style="text-align: center; margin-top: 10px;"></p>

            <!-- REGISTRATION LINK -->
            <p style="text-align: center; margin-top: 15px;">
                Don't have an account? <a href="admin-register.html" style="color: #007bff; text-decoration: none;">Register here</a>
            </p>

            <!-- FORGOT PASSWORD SECTION -->
            <div id="forgotPasswordSection" style="display: none; margin-top: 20px;">
                <hr>
                <h3>Reset Admin Password</h3>
                <p>Enter your admin email and new password.</p>

                <div class="form-group">
                    <label for="forgotEmail">Email</label>
                    <input type="email" id="forgotEmail" placeholder="Enter admin email">
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password">
                </div>

                <button type="button" id="resetPasswordButton" onclick="resetAdminPassword()">Reset Password</button>

                <p id="forgotMessage" style="text-align: center; margin-top: 10px;"></p>

                <p style="text-align: center; margin-top: 10px;">
                    <a href="#" onclick="hideForgotPassword(); return false;">Back to Admin Login</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        /* =========================
           CONFIG & BASE URL
        ========================= */
        const BASE_URL = "https://rogasreemart-production.up.railway.app";

        /* =========================
           ADMIN LOGIN FUNCTIONALITY
        ========================= */
        document.getElementById("adminLoginForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const button = document.getElementById("adminLoginButton");
            const message = document.getElementById("adminMessage");

            button.disabled = true;
            button.textContent = "Logging in...";
            message.textContent = "";

            try {
                const response = await fetch(BASE_URL + "/admin/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                if (!response.ok) {
                    throw new Error("Admin login failed");
                }

                const admin = await response.json();

                if (!admin || !admin.id) {
                    message.textContent = "Invalid admin email or password.";
                    message.style.color = "red";
                    return;
                }

                localStorage.setItem("adminId", admin.id);
                localStorage.setItem("adminName", admin.name);
                localStorage.setItem("adminEmail", admin.email);

                message.textContent = "Admin login successful!";
                message.style.color = "green";

                setTimeout(function() {
                    window.location.href = "admin-dashboard.html";
                }, 500);

            } catch (error) {
                console.error(error);
                message.textContent = "Backend connection failed. Please check network/Spring Boot.";
                message.style.color = "red";
            } finally {
                button.disabled = false;
                button.textContent = "Admin Login";
            }
        });

        /* =========================
           SHOW FORGOT PASSWORD
        ========================= */
        function showForgotPassword() {
            document.getElementById("forgotPasswordSection").style.display = "block";
        }

        /* =========================
           HIDE FORGOT PASSWORD
        ========================= */
        function hideForgotPassword() {
            document.getElementById("forgotPasswordSection").style.display = "none";
        }

        /* =========================
           RESET ADMIN PASSWORD
        ========================= */
        async function resetAdminPassword() {
            const email = document.getElementById("forgotEmail").value.trim();
            const password = document.getElementById("newPassword").value;
            const resetButton = document.getElementById("resetPasswordButton");
            const forgotMessage = document.getElementById("forgotMessage");

            if (!email || !password) {
                forgotMessage.textContent = "Please enter email and new password.";
                forgotMessage.style.color = "red";
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = "Updating...";
            forgotMessage.textContent = "";

            try {
                const response = await fetch(BASE_URL + "/admin/forgot-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const result = await response.text();

                if (result === "Password updated successfully") {
                    forgotMessage.textContent = "Password updated successfully!";
                    forgotMessage.style.color = "green";
                    document.getElementById("forgotEmail").value = "";
                    document.getElementById("newPassword").value = "";
                } else {
                    forgotMessage.textContent = result;
                    forgotMessage.style.color = "red";
                }

            } catch (error) {
                console.error(error);
                forgotMessage.textContent = "Backend connection failed. Please check network.";
                forgotMessage.style.color = "red";
            } finally {
                resetButton.disabled = false;
                resetButton.textContent = "Reset Password";
            }
        }
    </script>

</body>

</html>
