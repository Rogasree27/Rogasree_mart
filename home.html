<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home | ROGASREE MART</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>ROGASREE MART</h1>

        <nav>
            <a href="home.html">Home</a>
            <a href="cart.html">Cart</a>
            <a href="wishlist.html">Wishlist</a>

            <button
                type="button"
                onclick="logout()">
                Logout
            </button>
        </nav>

    </header>


    <main>

        <h2>Our Products</h2>

        <div id="productGrid">
            <p>Loading products...</p>
        </div>

    </main>


    <script>

        const userId =
            localStorage.getItem("loggedInUserId");


        // =========================
        // LOGOUT
        // =========================

        function logout() {

            localStorage.removeItem(
                "loggedInUserId"
            );

            localStorage.removeItem(
                "loggedInUserName"
            );

            localStorage.removeItem(
                "loggedInUserEmail"
            );

            alert("Logged out successfully!");

            window.location.href =
                "login.html";
        }


        // =========================
        // ADD TO CART
        // =========================

        async function addToCart(productId) {

            if (!userId) {

                alert("Please login first.");

                window.location.href =
                    "login.html";

                return;
            }


            try {

                const response =
                    await fetch(
                        "http://localhost:8080/cart",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                userId:
                                    Number(userId),

                                productId:
                                    Number(productId),

                                quantity: 1

                            })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to add to cart"
                    );
                }


                alert(
                    "Product added to cart!"
                );


            } catch (error) {

                console.error(error);

                alert(
                    "Unable to add product to cart."
                );
            }
        }


        // =========================
        // ADD TO WISHLIST
        // =========================

        async function addToWishlist(productId) {

            if (!userId) {

                alert("Please login first.");

                window.location.href =
                    "login.html";

                return;
            }


            try {

                const response =
                    await fetch(
                        "http://localhost:8080/wishlist",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                userId:
                                    Number(userId),

                                productId:
                                    Number(productId)

                            })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to add to wishlist"
                    );
                }


                alert(
                    "Product added to wishlist!"
                );


            } catch (error) {

                console.error(error);

                alert(
                    "Unable to add product to wishlist."
                );
            }
        }


        // =========================
        // LOAD PRODUCTS
        // =========================

        async function loadProducts() {

            const productGrid =
                document.getElementById(
                    "productGrid"
                );


            try {

                const response =
                    await fetch(
                        "http://localhost:8080/products"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to load products"
                    );
                }


                const products =
                    await response.json();


                productGrid.innerHTML = "";


                if (products.length === 0) {

                    productGrid.innerHTML =
                        "<p>No products available.</p>";

                    return;
                }


                products.forEach(function(product) {

                    const productCard =
                        document.createElement(
                            "article"
                        );


                    productCard.className =
                        "product-card";


                    productCard.innerHTML = `

                        <div class="product-image product-three">

                            <span>AVAILABLE</span>

                            <button
                                type="button"
                                onclick="addToWishlist(${product.id})">
                                ♡
                            </button>

                            <div>🛍️</div>

                        </div>


                        <div class="product-details">

                            <small>
                                ROGASREE MART
                            </small>

                            <h3>
                                ${product.name}
                            </h3>

                            <p>
                                ${product.description ||
                                "Quality product from ROGASREE MART."}
                            </p>


                            <div class="product-bottom">

                                <strong>
                                    ₹${product.price}
                                </strong>

                                <span>
                                    ★ 4.8
                                </span>

                            </div>


                            <button
                                type="button"
                                onclick="addToCart(${product.id})"
                                class="add-cart-button">

                                Add to Cart

                            </button>

                        </div>
                    `;


                    productGrid.appendChild(
                        productCard
                    );

                });


            } catch (error) {

                console.error(error);

                productGrid.innerHTML =
                    "<p>Unable to load products from server.</p>";
            }
        }


        // Load products when page opens
        loadProducts();

    </script>


</body>

</html>
